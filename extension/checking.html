<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LinkGuard is checking this link</title>
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body class="page checking">
    <main class="card">
      <div class="pulse" aria-hidden="true"></div>
      <p class="eyebrow">LinkGuard · local check then server if needed</p>
      <h1>Checking this URL</h1>
      <p id="url" class="url">…</p>
      <ol class="steps">
        <li>URLhaus known-malware lookup</li>
        <li>Placeholder lexical model</li>
        <li>Gemini only if confidence is low or the URL looks suspicious</li>
      </ol>
      <p class="fine">The destination page is not visited during analysis.</p>
      <p id="status" class="fine">Contacting LinkGuard API…</p>
    </main>
    <script src="checking.js"></script>
  </body>
</html>
