<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phisang</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="animations.css">
  </head>
  <body class="popup">
    <main class="panel">
      <header class="brand"><svg class="brand-mark" viewBox="48 2 64 192" width="15" height="44" aria-hidden="true"><path d="M80 38 C 78 27 76 20 74 12" fill="none" stroke="#467235" stroke-width="9" stroke-linecap="round"/><path d="M80 34 C 66 44 56 84 56 120 C 56 152 66 174 80 184 C 75 150 71 100 76 40 Z" fill="#FFBF00"/><path d="M76 40 C 71 100 75 150 80 184 C 85 186 89 184 91 178 C 87 148 87 96 84 40 Z" fill="#FFBF00"/><ellipse cx="86" cy="183" rx="4.4" ry="5.6" fill="#8A5A0F"/><path d="M84 40 C 87 96 87 148 91 178 C 101 168 104 146 104 120 C 104 84 94 44 80 34 Z" fill="#FFBF00"/></svg><strong>Phisang</strong></header>

        <p id="address" class="address"></p>
        <p id="status" class="error" role="status"></p>
        <div id="scanning" hidden></div>
        <div id="progress" hidden></div>
        <div id="result"><p>Loading the last scan?</p></div>
        <button id="rescan" class="secondary" type="button" hidden>Rescan</button><label class="toggle" for="enabled"><span>Protect navigations</span><input type="checkbox" id="enabled" checked></label>
        <section class="local-cache" aria-label="Addresses you allowed">
          <p class="eyebrow">Addresses you allowed</p>
          <p id="allow-status" class="fine" role="status"></p>
          <ul id="allow-list" class="allow-list"></ul>
        </section>
        <section class="local-cache" aria-label="Local cache">
          <p class="eyebrow">Local cache</p>
          <p id="cache-status" class="fine" role="status"></p>
          <button id="clear-cache" class="secondary" type="button">Clear local cache</button>
        </section>
      <footer>A low risk score is not a guarantee of safety. Threat information from URLhaus / abuse.ch.</footer>
    </main>
    <script src="banana.js"></script>
    <script src="verdicts.js"></script>
    <script src="cache.js"></script>
    <script src="allowlist.js"></script>
    <script src="trusted-hosts.js"></script>
    <script src="content-guard.js"></script>
    <script src="stream.js"></script>
    <script src="api.js"></script>
    <script src="result-ui.js"></script>
    <script src="result-page.js"></script>
  </body>
</html>
